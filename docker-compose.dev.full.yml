services:
  db:
    image: postgres:16
    container_name: autobuysell_dev_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autosys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autosys}
      POSTGRES_DB: ${POSTGRES_DB:-autosys}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - trading-net-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autosys"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: autobuysell_dev_api
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-autosys}:${POSTGRES_PASSWORD:-autosys}@db:5432/${POSTGRES_DB:-autosys}
    volumes:
      - ./api:/app
      - ./broker_accounts.json:/app/broker_accounts.json:ro
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trading-net-dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-config /app/logging_config.json

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_SERVER_URL: ${NEXT_PUBLIC_BACKEND_SERVER_URL_DEV:-}
        NEXT_PUBLIC_BACKEND_PORT: ${NEXT_PUBLIC_BACKEND_PORT_DEV:-8002}
    container_name: autobuysell_dev_frontend
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_SERVER_URL=${NEXT_PUBLIC_BACKEND_SERVER_URL_DEV:-}
      - NEXT_PUBLIC_BACKEND_PORT=${NEXT_PUBLIC_BACKEND_PORT_DEV:-8002}
    depends_on:
      - api
    networks:
      - trading-net-dev

volumes:
  postgres_data_dev:

networks:
  trading-net-dev:
    driver: bridge
